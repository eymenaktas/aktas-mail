<!doctype html>
<html lang="tr" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Aktaş Mail</title>
    <meta name="description" content="Aktaş Mail — akts.tr posta kutusu. Kendi sunucusunda barınan e-posta; passkey ile parolasız giriş, anlık bildirim, Türkçe spam sınıflandırma." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="akts.tr" />
    <meta property="og:url" content="https://mail.akts.tr/" />
    <meta property="og:title" content="Aktaş Mail" />
    <meta property="og:description" content="akts.tr posta kutusu. Kendi sunucusunda, passkey ile parolasız giriş ve anlık bildirim." />
    <meta property="og:locale" content="tr_TR" />
    <meta property="og:image" content="https://mail.akts.tr/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Aktaş Mail — akts.tr posta kutusu" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://mail.akts.tr/og.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <!-- Standart ad; apple- öneki kullanımdan kalktı. Safari eskisini de
         okuduğu için ikisi birden duruyor. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Aktaş Mail" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      /*
       * Temayı React yüklenmeden ÖNCE uygula.
       * Bu satır içi script olmasa sayfa önce açık temada boyanır,
       * sonra koyuya zıplardı (flash of wrong theme).
       *
       * Mantık src/lib/theme.ts ile aynı — biri değişirse diğeri de
       * değişmeli.
       */
      (function () {
        var t = null;
        try {
          var v = localStorage.getItem("am_theme");
          if (v === "light" || v === "dark") t = v;
        } catch (e) {
          /* gizli sekmede localStorage kapalı olabilir */
        }
        if (!t) {
          t =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        }
        document.documentElement.dataset.theme = t;
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute("content", t === "dark" ? "#1f1f1f" : "#ffffff");
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%235b9bff'/%3E%3Cstop offset='1' stop-color='%231558d6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='2' y='2' width='44' height='44' rx='12' fill='url(%23g)'/%3E%3Cpath d='M24 13 L34 34' stroke='white' stroke-width='4.4' stroke-linecap='round'/%3E%3Cpath d='M24 13 L14 34' stroke='white' stroke-width='4.4' stroke-linecap='round'/%3E%3Cpath d='M18.4 27.5 H29.6' stroke='%23c2e7ff' stroke-width='4.4' stroke-linecap='round'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Service worker yalnızca HTTPS'te (ve localhost'ta) kaydedilir.
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("/sw.js").catch(function () {});
        });
      }
    </script>
  </body>
</html>
